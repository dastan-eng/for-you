<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя...</title>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #fbc2eb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Летающие сердечки и искорки */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 180, 0.6);
            font-size: 20px;
            animation: float 7s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Главная карточка */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px 20px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeIn 1.2s ease-in-out;
        }

        /* Polaroid-снимок */
        .photo-frame {
            background: #fff;
            padding: 10px 10px 30px 10px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 200px;
            margin: 0 auto 15px auto;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }
        .photo-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }
        .photo-frame img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        h1 {
            font-family: 'Marck Script', cursive;
            font-size: 36px;
            color: #2b2d42;
        }
        .pulse-heart {
            font-size: 22px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* Кнопка музыки */
        .music-btn {
            background: #fff;
            border: 2px solid #ff4b5c;
            color: #ff4b5c;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 75, 92, 0.15);
        }
        .music-btn:hover {
            background: #ff4b5c;
            color: #fff;
        }

        /* Блок субтитров музыки */
        .lyrics-box {
            background: rgba(255, 240, 245, 0.8);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-style: italic;
            font-size: 14px;
            color: #c72c41;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #ffb6c1;
        }

        /* Блок текста с эффектом печати */
        .letter-container {
            min-height: 110px;
            text-align: left;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.65);
            padding: 16px;
            border-radius: 16px;
            border-left: 4px solid #ff4b5c;
        }
        .typed-text {
            font-size: 15px;
            line-height: 1.6;
            color: #4a4e69;
            white-space: pre-line;
            font-weight: 400;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 15px;
            background-color: #ff4b5c;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Кнопка действия внизу */
        .btn-sorry {
            background: linear-gradient(135deg, #ff4b5c, #ff6b81);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 75, 92, 0.4);
            border: none;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }
        .btn-sorry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 75, 92, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Локальный файл фоновой музыки -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <div class="card">
        <!-- Фото Polaroid -->
        <div class="photo-frame">
            <img src="photo.jpg" alt="Наше фото">
        </div>

        <!-- Заголовок -->
        <div class="header-container">
            <span class="pulse-heart">💖</span>
            <h1>Прости меня...</h1>
            <span class="pulse-heart">💖</span>
        </div>
        
        <!-- Кнопка музыки -->
        <button class="music-btn" onclick="toggleMusic()">🎵 Включить музыку</button>

        <!-- Субтитры песни -->
        <div class="lyrics-box" id="lyrics">
            🎵 Мирбек Атабеков — Кечир мени
        </div>

        <!-- Текст извинения с печатью -->
        <div class="letter-container">
            <span class="typed-text" id="typed"></span><span class="cursor"></span>
        </div>

        <!-- Кнопка действия -->
        <button class="btn-sorry" onclick="forgiveMe()">Нажми сюда ✨</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // Твоя ссылка на Instagram Reel
        const MY_LINK = "https://www.instagram.com/reel/DbTZAoOymEX/?psln=YjZsdnNjd3VhYXht/";

        // Текст извинения
        const text = `Кечирчииии 💕`;

        // Караоке-субтитры для песни Мирбека Атабекова
        const lyricsData = [
            { time: 0, text: "🎵 Мирбек Атабеков — Кечир мени" },
            { time: 13, text: "Санага салып менин түшүмө кирдиң..." },
            { time: 18, text: "Садагам күнүм болуп күлмүңдөп тийгиң..." },
            { time: 24, text: "Кайдасың айтчы деги ашыгым азыр?" },
            { time: 29, text: "Кадырын кечиреми кечикпи билдим..." },
            { time: 35, text: "Эстесем эзилемин от болуп күйөм..." },
            { time: 41, text: "Эх жаным кечирилгис беле эле күнөөм?" },
            { time: 47, text: "Мейли күн арадан ай жылдар өтсө да..." },
            { time: 52, text: "Мен сени махабатым баары бир сүйөм!" },
            { time: 58, text: "Эркем ай, кечирем сени..." },
            { time: 64, text: "Эркелевемби кайрылып келчи, кечирип мени..." },
            { time: 70, text: "Сүйүүмө күбөм менин асманда булут..." },
            { time: 75, text: "Сезимим сага деген булактай тунук..." }
        ];

        const music = document.getElementById('bgMusic');
        const lyricsBox = document.getElementById('lyrics');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                document.querySelector('.music-btn').innerText = '🎵 Включить музыку';
                isPlaying = false;
            } else {
                music.play();
                document.querySelector('.music-btn').innerText = '⏸ Выключить музыку';
                isPlaying = true;
            }
        }

        // Обновление субтитров при проигрывании музыки
        music.addEventListener('timeupdate', () => {
            const currentTime = music.currentTime;
            for (let i = lyricsData.length - 1; i >= 0; i--) {
                if (currentTime >= lyricsData[i].time) {
                    lyricsBox.innerText = lyricsData[i].text;
                    break;
                }
            }
        });

        // Эффект печати текста
        let index = 0;
        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typed").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 35);
            }
        }
        window.onload = typeWriter;

        // Летающие сердечки
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = ['❤️', '💖', '✨', '🌸', '⭐'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 5 + 's';
            heart.style.fontSize = Math.random() * 10 + 16 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 7000);
        }
        setInterval(createHeart, 400);

        // Салют и переход по ссылке
        function forgiveMe() {
            music.play();

            const duration = 2 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4b5c', '#ff6b81', '#ffd1dc']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4b5c', '#ff6b81', '#ffd1dc']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();

            setTimeout(() => {
                window.location.href = MY_LINK;
            }, 1800);
        }
    </script>
</body>
</html>
